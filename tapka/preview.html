<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#17191C">
  <title>Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { overflow-y: auto !important; height: auto !important; min-height: 100%; }
    body { background: #FAF8F4; }
    .card-page { align-items: flex-start; padding: 16px 16px 32px; min-height: 100%; }
  </style>
</head>
<body>
  <main class="card-page" id="app">
    <div class="card-shell">
      <header class="profile-header">
        <div class="photo-ring" data-hidden="true">
          <img class="profile-photo" id="logo" src="" alt="" width="112" height="112">
        </div>
        <h1 class="profile-name" id="brandName">Brand</h1>
        <p class="profile-role" id="tagline"></p>
        <p class="profile-statement" id="statement"></p>
      </header>
      <nav class="quick-actions" id="quickActions" aria-label="Quick actions"></nav>
      <section class="contact-list" id="contactList" aria-label="Contact details"></section>
      <section class="social-section" id="socialSection" hidden>
        <h2 class="section-label">Connect</h2>
        <div class="social-grid" id="social"></div>
      </section>
      <div class="save-contact-wrap">
        <button type="button" class="save-contact-btn" id="saveContact">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
          Save Contact
        </button>
      </div>
      <footer class="card-footer">
        <span>Powered by</span>
        <strong>Tapka.ma</strong>
      </footer>
    </div>
  </main>
  <script>window.__PREVIEW_MODE__ = true;</script>
  <script src="script.js"></script>
</body>
</html>
